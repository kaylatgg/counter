# Runs the math, share link, and projects tests on every push and pull request.
# They use plain Node, so there's nothing to install. The browser tests run
# locally (see tests/e2e/README.md).
name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run test:unit
